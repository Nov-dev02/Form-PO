<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradasi Background Elegan -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <!-- Gradasi Aksen Profesional (Emerald ke Cyan) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  
  <!-- Kotak Utama Ikon (Squircle ala Aplikasi Modern) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Border Tipis Mewah -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="8" opacity="0.6"/>

  <!-- Simbol Kotak Gudang / Isometric Box -->
  <polygon points="256,120 380,180 256,240 132,180" fill="url(#accentGrad)" opacity="0.9"/>
  <polygon points="132,198 256,258 256,392 132,332" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="4"/>
  <polygon points="380,198 256,258 256,392 380,332" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="4"/>
  
  <!-- Elemen QR / Scanner Tech di Tengah Kotak -->
  <rect x="216" y="270" width="80" height="80" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="6"/>
  <rect x="232" y="286" width="20" height="20" rx="4" fill="#10b981"/>
  <rect x="260" y="286" width="20" height="20" rx="4" fill="#38bdf8"/>
  <rect x="232" y="314" width="20" height="20" rx="4" fill="#38bdf8"/>
  <circle cx="270" cy="324" r="6" fill="#10b981"/>
</svg>