<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem PO Gudang</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="Favicon/Logo.png">
    <!-- Html5-qrcode library untuk scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

    <div class="container">
        <!-- Login Section -->
        <div id="loginSection" class="login-box">
            
            <!-- Robot & Speech Bubble Container dengan Robot Tangan Menutup Mata -->
            <div class="robot-container" id="robotContainer">
                <div class="robot-bubble" id="robotBubble">Masukkan akun internal gudang</div>
                
                <svg class="robot-svg" width="100" height="90" viewBox="0 0 100 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Antena -->
                    <line x1="50" y1="16" x2="50" y2="8" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="50" cy="6" r="3.5" fill="#38bdf8"/>
                    
                    <!-- Kepala Robot -->
                    <rect x="26" y="16" width="48" height="38" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
                    
                    <!-- Mata Robot -->
                    <circle cx="41" cy="32" r="4.5" fill="#38bdf8"/>
                    <circle cx="59" cy="32" r="4.5" fill="#38bdf8"/>
                    
                    <!-- Mulut Robot -->
                    <rect x="43" y="42" width="14" height="3.5" rx="1.75" fill="#38bdf8"/>
                    
                    <!-- Badan & Leher -->
                    <rect x="44" y="54" width="12" height="8" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
                    <rect x="32" y="62" width="36" height="22" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>

                    <!-- Tangan Kiri (Bergerak menutup mata saat password diklik) -->
                    <g class="left-hand">
                        <rect x="14" y="50" width="12" height="20" rx="6" fill="#38bdf8"/>
                    </g>
                    <!-- Tangan Kanan (Bergerak menutup mata saat password diklik) -->
                    <g class="right-hand">
                        <rect x="74" y="50" width="12" height="20" rx="6" fill="#38bdf8"/>
                    </g>
                </svg>
            </div>

            <h2>Login Gudang</h2>
            <p class="subtitle">Silakan masuk menggunakan akun Anda</p>

            <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-with-icon">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        </span>
                        <input type="text" id="username" placeholder="Masukkan username" required autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        </span>
                        <input type="password" id="password" placeholder="Masukkan password" required>
                        <button type="button" id="togglePassword" class="eye-icon" onclick="togglePasswordVisibility()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c3 5 7 7 10 7s7-2 10-7"></path></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btnLogin">Masuk</button>
                <div id="loginError" class="error-msg"></div>
            </form>
        </div>

        <!-- PO Form Section -->
        <div id="poSection" class="hidden">
            <div class="header-po">
                <h2>Form Purchase Order</h2>
                <button type="button" class="btn-logout" onclick="handleLogout()">Logout</button>
            </div>
            <p class="subtitle">Buat PO barang gudang dengan mudah</p>

            <div class="scanner-section">
                <p>Pindai barcode menggunakan kamera HP:</p>
                <button type="button" id="btnToggleScanner" class="btn-scanner">📷 Buka Kamera Scanner</button>
                <div id="reader" style="display: none; margin-top: 10px; border-radius: 8px; overflow: hidden;"></div>
            </div>

            <form id="poForm" onsubmit="submitPO(event)">
                <div class="form-group">
                    <label>Tanggal</label>
                    <input type="date" id="poTanggal" required>
                </div>

                <div class="form-group">
                    <label>Pilih Barang (Cari / Ketik)</label>
                    <button type="button" id="triggerModal" class="btn-modal-trigger">-- Pilih Barang dari Master --</button>
                </div>

                <div class="form-group">
                    <label>Kode Barang</label>
                    <input type="text" id="poKode" readonly placeholder="Otomatis terisi">
                </div>

                <div class="form-group">
                    <label>Nama Barang</label>
                    <input type="text" id="poNama" readonly placeholder="Otomatis terisi">
                </div>

                <div class="form-group">
                    <label>PIC</label>
                    <input type="text" id="poPic" readonly placeholder="Otomatis terisi">
                </div>

                <div class="form-group">
                    <label>Jumlah PO</label>
                    <input type="number" id="poJumlah" min="1" placeholder="Masukkan jumlah" required>
                </div>

                <button type="submit" id="btnSubmit">Kirim PO</button>
                <div id="poMessage" class="success-msg"></div>
            </form>
        </div>
    </div>

    <!-- Modal Pop-up Cari Barang -->
    <div id="popupSearch" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="font-size: 16px; color: #f8fafc; margin: 0;">Pilih Barang Master</h3>
                <button type="button" id="btnCloseModal" class="btn-close-modal">&times;</button>
            </div>
            <input type="text" id="searchInputPopup" class="search-input-modal" placeholder="Ketik nama atau kode barang..." autocomplete="off">
            <div id="itemListPopup" class="item-list-container">
                <!-- Daftar item muncul via JS -->
            </div>
        </div>
    </div>

    <div class="footer-app">
        &copy; 2026 All Right Reserved By : Novan Arifki
    </div>

    <script src="script.js"></script>
</body>
</html>
