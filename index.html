<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem PO Gudang</title>
    <!-- Library html5-qrcode untuk kamera scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="Favicon/Logo.png">
</head>
<body>

    <div class="container">
        <!-- Bagian Login -->
        <div id="loginSection" class="login-box">
            <!-- Robot Animasi Nutup Mata -->
            <div class="robot-container" id="robotContainer">
                <svg class="robot-svg" viewBox="0 0 200 180" width="110" height="100">
                    <!-- Antena -->
                    <path d="M100 45 V20" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
                    <circle cx="100" cy="14" r="7" fill="#38bdf8" class="antenna-ball"/>
                    
                    <!-- Telinga -->
                    <rect x="48" y="65" width="8" height="25" rx="4" fill="#334155" />
                    <rect x="144" y="65" width="8" height="25" rx="4" fill="#334155" />
                    
                    <!-- Kepala Robot -->
                    <rect x="54" y="45" width="92" height="65" rx="22" fill="#f8fafc" />
                    
                    <!-- Visor / Layar Muka -->
                    <rect x="64" y="55" width="72" height="42" rx="12" fill="#0b0f19" />
                    
                    <!-- Mata Robot -->
                    <circle cx="85" cy="76" r="8" fill="#38bdf8" />
                    <circle cx="115" cy="76" r="8" fill="#38bdf8" />
                    <circle cx="87" cy="74" r="2.5" fill="#fff" />
                    <circle cx="117" cy="74" r="2.5" fill="#fff" />
                    
                    <!-- Badan Robot -->
                    <path d="M72 118 C72 112, 128 112, 128 118 V155 C128 162, 72 162, 72 155 Z" fill="#f8fafc" />
                    <rect x="86" y="130" width="28" height="14" rx="4" fill="#0b0f19" />

                    <!-- Tangan Robot -->
                    <rect class="robot-hand left-hand" x="65" y="112" width="18" height="12" rx="6" fill="#f8fafc" />
                    <rect class="robot-hand right-hand" x="117" y="112" width="18" height="12" rx="6" fill="#f8fafc" />
                </svg>
            </div>

            <h2>Login Sistem PO</h2>
            <p class="subtitle">Masukkan akun internal gudang</p>
            
            <div class="form-group">
                <label>Username</label>
                <div class="input-with-icon">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </span>
                    <input type="text" id="username" placeholder="Masukkan username">
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-with-icon">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </span>
                    <input type="password" id="password" placeholder="Masukkan password">
                    <span id="togglePassword" class="eye-icon" title="Lihat/Sembunyikan Password" onclick="togglePasswordVisibility()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12c3 5 7 7 10 7s7-2 10-7"></path>
                        </svg>
                    </span>
                </div>
            </div>

            <button type="button" id="btnLogin" onclick="handleLogin()">Login</button>
            <div id="loginError" class="error-msg"></div>
        </div>

        <!-- Bagian Form PO (Setelah Login) -->
        <div id="poSection" class="hidden">
            <div class="header-po">
                <h2>Form Purchase Order</h2>
                <button type="button" class="btn-logout" onclick="handleLogout()">Logout</button>
            </div>

            <div class="scanner-section">
                <p>Cari atau Scan Barang</p>
                <button type="button" id="btnToggleScanner" class="btn-scanner">📷 Buka Kamera Scanner</button>
                <div id="reader" style="display: none; width: 100%; max-width: 400px; margin: 10px auto;"></div>
            </div>

            <form id="poForm" onsubmit="submitPO(event)">
                <div class="form-group">
                    <label>Tanggal PO</label>
                    <input type="date" id="poTanggal" required>
                </div>

                <div class="form-group">
                    <label>Pilih Barang</label>
                    <button type="button" id="triggerModal" class="btn-modal-trigger">-- Pilih Barang dari Master --</button>
                </div>

                <div class="form-group">
                    <label>Kode Barang</label>
                    <input type="text" id="poKode" readonly required>
                </div>

                <div class="form-group">
                    <label>Nama Barang</label>
                    <input type="text" id="poNama" readonly required>
                </div>

                <div class="form-group">
                    <label>PIC</label>
                    <input type="text" id="poPic" readonly required>
                </div>

                <div class="form-group">
                    <label>Jumlah</label>
                    <input type="number" id="poJumlah" min="1" placeholder="Masukkan jumlah" required>
                </div>

                <button type="submit" id="btnSubmit">Kirim PO</button>
                <div id="poMessage" class="success-msg"></div>
            </form>
        </div>
    </div>

    <!-- Footer Profesional -->
    <footer class="footer-app">
        &copy; 2026 All Rights Reserved. <strong>dev Novan Arifki</strong>
    </footer>

   <!-- POP-UP MODAL PENCARIAN -->
    <div id="popupSearch" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="margin: 0; font-size: 16px; color: #fff;">Cari Barang Master</h3>
                <button type="button" id="btnCloseModal" class="btn-close-modal">&times;</button>
            </div>
            <input type="text" id="searchInputPopup" placeholder="Ketik nama atau kode barang..." class="search-input-modal">
            <div id="itemListPopup" class="item-list-container"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
